<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrito | OMAKASE</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="carrito.css">
</head>
<body style="background:#0a0a0a;">
<div class="carrito-wrap">
  <a class="volver" href="index.html">← Seguir comprando</a>
  <h1>🛒 Tu carrito</h1>

  <div id="lista-carrito"></div>

  <div id="resumen" class="oculto">
    <div class="cart-total">Total: <span id="total">$0.00</span></div>
    <div style="display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;">
      <button class="btn-omakase btn-sec" id="btn-vaciar">Vaciar carrito</button>
      <button class="btn-omakase" id="btn-comprar">Comprar</button>
    </div>
  </div>

  <!-- CHECKOUT -->
  <div id="checkout" class="checkout-box oculto">
    <h2>Finalizar compra</h2>
    <div class="opciones-cliente">
      <label><input type="radio" name="tipo" value="existente" checked> Ya soy cliente registrado</label>
      <label><input type="radio" name="tipo" value="nuevo"> Soy cliente nuevo</label>
    </div>

    <!-- Cliente existente -->
    <div id="form-existente">
      <label for="email-existente">Correo con el que te registraste</label>
      <input type="email" id="email-existente" placeholder="correo@ejemplo.com" autocomplete="email">
    </div>

    <!-- Cliente nuevo -->
    <div id="form-nuevo" class="oculto">
      <div class="grid-2">
        <div><label>Nombre completo</label><input type="text" id="n-nombre"></div>
        <div><label>Correo electrónico</label><input type="email" id="n-email"></div>
        <div><label>Contraseña (mín. 6 caracteres)</label><input type="password" id="n-password"></div>
        <div><label>Teléfono</label><input type="text" id="n-telefono"></div>
        <div><label>Calle y número</label><input type="text" id="n-calle"></div>
        <div><label>Colonia</label><input type="text" id="n-colonia"></div>
        <div><label>Ciudad</label><input type="text" id="n-ciudad"></div>
        <div><label>Código postal</label><input type="text" id="n-cp"></div>
      </div>
    </div>

    <div id="mensaje" class="msg"></div>
    <button class="btn-omakase" id="btn-confirmar">Confirmar pedido</button>
  </div>
</div>

<script src="js/carrito.js"></script>
<script>
const $ = id => document.getElementById(id);
const dinero = n => '$' + n.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function pintarCarrito() {
  const items = Carrito.obtener();
  const cont = $('lista-carrito');
  cont.innerHTML = '';

  if (!items.length) {
    cont.innerHTML = '<div class="vacio">Tu carrito está vacío.</div>';
    $('resumen').classList.add('oculto');
    $('checkout').classList.add('oculto');
    return;
  }

  items.forEach(it => {
    const row = document.createElement('div');
    row.className = 'cart-item';

    const info = document.createElement('div');
    const n = document.createElement('div'); n.className = 'nombre'; n.textContent = it.nombre;
    const p = document.createElement('div'); p.className = 'precio'; p.textContent = dinero(it.precio) + ' c/u';
    info.append(n, p);

    const qty = document.createElement('div'); qty.className = 'qty';
    const menos = document.createElement('button'); menos.textContent = '−';
    const num = document.createElement('span'); num.textContent = it.cantidad;
    const mas = document.createElement('button'); mas.textContent = '+';
    menos.onclick = () => { Carrito.cambiarCantidad(it.id, -1); pintarCarrito(); };
    mas.onclick   = () => { Carrito.cambiarCantidad(it.id, 1);  pintarCarrito(); };
    qty.append(menos, num, mas);

    const sub = document.createElement('div'); sub.textContent = dinero(it.precio * it.cantidad);

    const quitar = document.createElement('button'); quitar.className = 'btn-quitar'; quitar.textContent = '✕';
    quitar.onclick = () => { Carrito.quitar(it.id); pintarCarrito(); };

    row.append(info, qty, sub, quitar);
    cont.appendChild(row);
  });

  $('total').textContent = dinero(Carrito.total());
  $('resumen').classList.remove('oculto');
}

function mostrar(texto, tipo) {
  const m = $('mensaje');
  m.className = 'msg ' + tipo;
  m.textContent = texto;
}
function limpiarMensaje() { $('mensaje').className = 'msg'; }

$('btn-vaciar').onclick = () => { if (confirm('¿Vaciar el carrito?')) { Carrito.vaciar(); pintarCarrito(); } };
$('btn-comprar').onclick = () => { $('checkout').classList.remove('oculto'); $('checkout').scrollIntoView({ behavior: 'smooth' }); };

document.querySelectorAll('input[name=tipo]').forEach(r => r.addEventListener('change', () => {
  const nuevo = document.querySelector('input[name=tipo]:checked').value === 'nuevo';
  $('form-existente').classList.toggle('oculto', nuevo);
  $('form-nuevo').classList.toggle('oculto', !nuevo);
  limpiarMensaje();
}));

$('btn-confirmar').onclick = async () => {
  limpiarMensaje();
  const modo = document.querySelector('input[name=tipo]:checked').value;
  const payload = {
    modo,
    carrito: Carrito.obtener().map(i => ({ id: i.id, cantidad: i.cantidad }))
  };

  if (modo === 'existente') {
    payload.email = $('email-existente').value.trim();
    if (!payload.email) return mostrar('Escribe tu correo registrado.', 'error');
  } else {
    payload.email = $('n-email').value.trim();
    payload.nombre = $('n-nombre').value.trim();
    payload.password = $('n-password').value;
    payload.direccion = {
      calle_numero: $('n-calle').value.trim(),
      colonia: $('n-colonia').value.trim(),
      ciudad: $('n-ciudad').value.trim(),
      codigo_postal: $('n-cp').value.trim(),
      telefono: $('n-telefono').value.trim()
    };
    const d = payload.direccion;
    if (!payload.nombre || !payload.email || !payload.password || !d.calle_numero || !d.colonia || !d.ciudad || !d.codigo_postal || !d.telefono)
      return mostrar('Completa todos los campos.', 'error');
    if (payload.password.length < 6) return mostrar('La contraseña debe tener al menos 6 caracteres.', 'error');
  }

  const btn = $('btn-confirmar');
  btn.disabled = true;
  try {
    const res = await fetch('finalizar_compra.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.ok) {
      Carrito.vaciar();
      $('lista-carrito').innerHTML = '';
      $('resumen').classList.add('oculto');
      $('checkout').innerHTML = '<h2>¡Gracias por tu compra! 🎉</h2>' +
        '<p>Tu pedido <strong>#' + data.id_pedido + '</strong> por <strong>' + dinero(data.total) + '</strong> fue registrado.</p>' +
        '<a class="btn-omakase" style="text-decoration:none; display:inline-block;" href="index.html">Volver al inicio</a>';
    } else {
      mostrar(data.mensaje, 'error');
    }
  } catch (err) {
    mostrar('No se pudo conectar con el servidor. ¿Está Apache encendido?', 'error');
  }
  btn.disabled = false;
};

pintarCarrito();
</script>
</body>
</html>
